name: ViralOS CPU baseline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VIRALOS_ENABLE_PRIVATE_UPLOAD: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    env:
      VIRALOS_DB: /tmp/viral-ci-synthetic-test.sqlite
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local CPU media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute unit and integration tests
        env:
          VIRALOS_REQUIRE_HINDI_PREVIEW: '1'
        run: python -m pytest -q
      - name: Validate archived package manifest
        run: python tools/verify_package.py
      - name: Validate JavaScript and Python syntax
        run: |
          node --check app/static/app.js
          node --check app/static/domain_review.js
          python -m compileall -q app tools tests

  windows-contracts:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      VIRALOS_DB: viral-ci-synthetic-test.sqlite
      VIRALOS_ENABLE_PRIVATE_UPLOAD: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate local-only portable contracts (not owner Windows hardware)
        run: |
          python -m pytest -q tests/test_m24_audio.py tests/test_m24_provenance_benchmark.py tests/test_m24_piper_runtime.py tests/test_m24_voice_acceptance.py tests/test_m25_dub_retime.py tests/test_m25_bilingual_delivery.py tests/test_local_http_guard.py tests/test_m32_owner_signoff.py tests/test_m32_reconciliation.py tests/test_domain_adapters.py tests/test_domain_storyboards.py tests/test_domain_draft_video.py tests/test_domain_draft_audit.py tests/test_domain_draft_review.py tests/test_domain_review_batch.py tests/test_domain_review_queue.py tests/test_domain_review_web.py tests/test_domain_release_gate.py tests/test_localization_review.py tests/test_offline_recovery.py tests/test_offline_acceptance_drill.py tests/test_owner_backup_reconcile.py tests/test_compute_router.py tests/test_pilot_pipeline.py tests/test_pilot_run_verify.py tests/test_pilot_snapshot.py tests/test_narration_qc.py tests/test_narration_prepare.py tests/test_bilingual_compose.py tests/test_bilingual_pilot.py tests/test_bilingual_snapshot.py tests/test_hindi_typography.py tests/test_native_hindi_pilot.py tests/test_bilingual_review_dashboard.py tests/test_narration_loudness.py tests/test_phase15h.py tests/test_phase15i.py tests/test_production_mix_pilot.py tests/test_phase15k.py tests/test_phase15l.py tests/test_phase15m.py tests/test_phase15n.py tests/test_phase15o.py tests/test_phase15p.py tests/test_phase15q.py tests/test_phase15r.py tests/test_phase15s.py tests/test_phase15t.py tests/test_phase15u.py tests/test_phase15v.py tests/test_phase15w.py tests/test_phase15x.py tests/test_phase15y.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q app tools tests
      - name: Validate Windows PowerShell script presence
        shell: pwsh
        run: |
          foreach ($file in @('tools/windows_acceptance.ps1','tools/run_windows_local_acceptance.ps1','tools/phase13_windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | Out-String | Write-Host; throw "PowerShell parse failed: $file" }
          }
