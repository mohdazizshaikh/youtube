name: ViralOS CPU baseline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VIRALOS_ENABLE_PRIVATE_UPLOAD: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    env:
      VIRALOS_DB: /tmp/viral-ci-synthetic-test.sqlite
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local CPU media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute unit and integration tests
        run: python -m pytest -q
      - name: Validate archived package manifest
        run: python tools/verify_package.py
      - name: Validate JavaScript and Python syntax
        run: |
          node --check app/static/app.js
          python -m compileall -q app tools tests

  windows-contracts:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      VIRALOS_DB: viral-ci-synthetic-test.sqlite
      VIRALOS_ENABLE_PRIVATE_UPLOAD: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate local-only portable contracts (not owner Windows hardware)
        run: |
          python -m pytest -q tests/test_m24_audio.py tests/test_domain_adapters.py tests/test_domain_release_gate.py tests/test_localization_review.py tests/test_offline_recovery.py tests/test_offline_acceptance_drill.py tests/test_owner_backup_reconcile.py tests/test_compute_router.py
          python -m compileall -q app tools tests
      - name: Validate Windows PowerShell script presence
        shell: pwsh
        run: |
          foreach ($file in @('tools/windows_acceptance.ps1','tools/run_windows_local_acceptance.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failed: $file" }
          }
